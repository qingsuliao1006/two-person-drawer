<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF9F5" />
<title>手势能力体检 · 记念</title>
<style>
  :root {
    --ink: #2f3a33;
    --ink-2: #4a5d4e;
    --muted: #6b7a70;
    --faint: #98a69d;
    --line: rgba(120, 150, 130, 0.22);
    --card: rgba(255, 255, 255, 0.74);
    --green: #7d9484;
    --green-d: #4a5d4e;
    --ok: #3f7a56;
    --bad: #9b5a4a;
    --warn: #8a7333;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: linear-gradient(168deg, #faf9f5 0%, #f4f7f2 52%, #e9efe7 100%);
    color: var(--ink);
    font-family: "PingFang SC", "Noto Sans SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    font-weight: 400;
    padding: calc(env(safe-area-inset-top) + 26px) 16px calc(env(safe-area-inset-bottom) + 34px);
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; }

  header { padding: 0 4px 20px; }
  .cap {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--faint);
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--green-d);
  }
  .sub {
    margin: 10px 0 0;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  h2 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink-2);
  }
  .hint {
    margin: 0 0 12px;
    font-size: 12.5px;
    color: var(--faint);
    line-height: 1.65;
  }

  .rows { display: flex; flex-direction: column; gap: 1px; }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid rgba(120, 150, 130, 0.13);
    font-size: 13px;
  }
  .row:first-child { border-top: 0; }
  .row .k {
    flex: 0 0 92px;
    color: var(--muted);
    font-size: 12.5px;
    padding-top: 1px;
  }
  .row .v {
    flex: 1;
    min-width: 0;
    word-break: break-word;
    color: var(--ink);
  }
  .row .v small { display: block; color: var(--faint); font-size: 11.5px; margin-top: 3px; line-height: 1.5; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    margin-right: 6px;
    letter-spacing: 0.04em;
    vertical-align: 1px;
  }
  .t-ok { background: rgba(63, 122, 86, 0.13); color: var(--ok); }
  .t-bad { background: rgba(155, 90, 74, 0.14); color: var(--bad); }
  .t-warn { background: rgba(138, 115, 51, 0.15); color: var(--warn); }
  .t-idle { background: rgba(125, 148, 132, 0.13); color: var(--muted); }

  button {
    display: block;
    width: 100%;
    height: 44px;
    border: 0;
    border-radius: 999px;
    background: var(--green);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  button:active { transform: scale(0.985); }
  button:disabled { opacity: 0.42; cursor: default; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--green-d);
    letter-spacing: 0.1em;
  }

  .preview {
    margin-top: 14px;
    border-radius: 14px;
    overflow: hidden;
    background: #dfe7dd;
    aspect-ratio: 4 / 3;
    position: relative;
  }
  .preview video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: translateZ(0);
  }
  .preview .fps {
    position: absolute;
    left: 10px;
    bottom: 10px;
    font-size: 11px;
    color: #fff;
    background: rgba(30, 45, 36, 0.55);
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.06em;
  }

  .verdict {
    margin: 0;
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink);
  }
  .verdict .big {
    display: block;
    font-size: 17px;
    color: var(--green-d);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .copy {
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--green-d);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(10px);
    background: rgba(45, 60, 50, 0.9);
    color: #fff;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s, transform 0.24s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main>
  <header>
    <p class="cap">Hand test</p>
    <h1>手势能力体检</h1>
    <p class="sub">这份报告决定手势功能能不能上。全部在你手机上完成，画面不会离开这台设备。</p>
  </header>

  <section class="card">
    <h2>一、运行环境</h2>
    <div class="rows" id="envRows"></div>
  </section>

  <section class="card">
    <h2>二、摄像头</h2>
    <p class="hint">点下面的按钮，系统会问你要不要允许。不允许也不影响其他部分。</p>
    <button id="camBtn">打开摄像头</button>
    <div class="rows" id="camRows" style="margin-top: 8px"></div>
    <div class="preview" id="previewWrap" hidden>
      <video id="video" playsinline muted autoplay></video>
      <span class="fps" id="fpsBadge">预览中</span>
    </div>
  </section>

  <section class="card">
    <h2>三、手势模型</h2>
    <p class="hint">需要先打开摄像头。模型就在本站，首次约 17MB，之后走浏览器缓存。</p>
    <button id="modelBtn" disabled>加载模型并测帧率</button>
    <div class="rows" id="modelRows" style="margin-top: 8px"></div>
  </section>

  <section class="card">
    <h2>四、陀螺仪（摄像头打不开时的备用路）</h2>
    <p class="hint">倾斜、摇动手机。这条不需要摄像头，也不用下模型。</p>
    <button id="gyroBtn" class="ghost">测试陀螺仪</button>
    <div class="rows" id="gyroRows" style="margin-top: 8px"></div>
  </section>

  <section class="card" id="verdictCard" hidden>
    <h2>结论</h2>
    <p class="verdict" id="verdictText"></p>
  </section>

  <button id="copyBtn" class="copy">复制报告发给我</button>
  <div class="toast" id="toast">已经复制</div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const report = [];
let reportLine = (k, v) => { report.push(k + '：' + v); };

/* ────────── 小工具 ────────── */

function row(host, key, valueHtml, tag) {
  const el = document.createElement('div');
  el.className = 'row';
  const tagHtml = tag ? '<span class="tag ' + tag.cls + '">' + tag.text + '</span>' : '';
  el.innerHTML = '<span class="k">' + key + '</span><span class="v">' + tagHtml + valueHtml + '</span>';
  host.appendChild(el);
  return el;
}

function state(el, text) {
  el.querySelector('.v').innerHTML = text;
}

/* ────────── 一、环境 ────────── */

const ua = navigator.userAgent;
const envRows = $('envRows');

let isDesktop = !/Android|iPad|iPhone|iPod|Mobile|Tablet/i.test(ua);

function detectEnv() {
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isWebView = isAndroid && /;\s*wv\)/.test(ua);
  const standalone =
    window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches ||
    window.matchMedia('(display-mode: fullscreen)').matches;

  let label = '普通浏览器';
  let note = '权限由浏览器自己弹窗询问，最容易成功。';
  let level = 'ok';

  if (isDesktop) {
    label = '电脑浏览器';
    note = '最理想的环境：没有壳挡权限，性能和分辨率都是手机上没法比的。';
    level = 'ok';
  } else if (isWebView) {
    label = '安卓 WebView（套壳）';
    note = '权限要由壳的宿主程序授予。壳没实现这段，摄像头会直接失败且没有弹窗。';
    level = 'bad';
  } else if (isIOS && standalone) {
    label = 'iOS 添加到主屏幕';
    note = '权限走系统层，多数机型可用，个别版本会黑屏。';
    level = 'warn';
  } else if (isAndroid && standalone) {
    label = '安卓安装的 Web App';
    note = '和浏览器差不多，但图标入口后的权限行为取决于内核版本。';
    level = 'warn';
  } else if (isIOS) {
    label = 'iOS Safari';
    note = '权限弹窗正常，成功率最高。';
  }

  return { label, note, level };
}

function hasSimd() {
  try {
    return WebAssembly.validate(
      new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]),
    );
  } catch {
    return false;
  }
}

function glInfo() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return { ok: false, renderer: '', version: '' };
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return {
      ok: true,
      version: gl.getParameter(gl.VERSION),
      renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : String(gl.getParameter(gl.RENDERER)),
    };
  } catch {
    return { ok: false, renderer: '', version: '' };
  }
}

(function env() {
  const e = detectEnv();
  row(envRows, '运行形态', e.label, { cls: 't-' + e.level, text: e.level === 'ok' ? '较好' : e.level === 'warn' ? '待观察' : '高危' });
  row(envRows, '说明', '<small>' + e.note + '</small>');
  reportLine('运行形态', e.label);

  const secure = window.isSecureContext;
  row(envRows, '安全上下文', secure ? '是（HTTPS）' : '否 —— 摄像头一定用不了', {
    cls: secure ? 't-ok' : 't-bad',
    text: secure ? '通过' : '失败',
  });
  reportLine('安全上下文', secure ? 'HTTPS' : '非安全');

  const hasGum = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  row(envRows, '摄像头接口', hasGum ? '存在' : '不存在 —— 这个环境没提供媒体接口', {
    cls: hasGum ? 't-ok' : 't-bad',
    text: hasGum ? '通过' : '失败',
  });
  reportLine('摄像头接口', hasGum ? '存在' : '不存在');

  const wasm = typeof WebAssembly === 'object';
  const simd = wasm && hasSimd();
  row(envRows, 'WASM / SIMD', wasm ? (simd ? '都支持' : '有 WASM，缺少 SIMD（会慢很多）') : '不支持 WASM', {
    cls: !wasm ? 't-bad' : simd ? 't-ok' : 't-warn',
    text: !wasm ? '失败' : simd ? '通过' : '降级',
  });
  reportLine('WASM SIMD', !wasm ? '不支持' : simd ? '支持' : '缺 SIMD');

  const g = glInfo();
  row(
    envRows,
    'WebGL',
    g.ok ? g.version + '<small>' + g.renderer + '</small>' : '不可用 —— 模型只能退回 CPU，帧率会掉',
    { cls: g.ok ? 't-ok' : 't-bad', text: g.ok ? '通过' : '失败' },
  );
  reportLine('WebGL', g.ok ? g.version + ' / ' + g.renderer : '不可用');

  if (navigator.deviceMemory) {
    row(envRows, '设备内存', '约 ' + navigator.deviceMemory + ' GB');
  }
  if (navigator.hardwareConcurrency) {
    row(envRows, 'CPU 核心', navigator.hardwareConcurrency + ' 核');
    reportLine('CPU 核心', String(navigator.hardwareConcurrency));
  }
  row(envRows, 'UA', '<small>' + ua + '</small>');
})();

/* ────────── 二、摄像头 ────────── */

const camRows = $('camRows');
const camBtn = $('camBtn');
const modelBtn = $('modelBtn');
let stream = null;
let camOk = false;

const CAM_ERROR = {
  NotAllowedError: '权限被拒绝。可能是你点了不允许，也可能是这个壳从来没向系统申请过摄像头。',
  NotFoundError: '这台设备上没找到摄像头。',
  NotReadableError: '摄像头被别的程序占用，或者系统层拿不到画面。',
  SecurityError: '页面不是 HTTPS，或者容器禁止了媒体访问。',
  AbortError: '启动过程被打断，再点一次试试。',
  OverconstrainedError: '摄像头不支持要求的参数。',
  TypeError: '这个环境根本没提供摄像头接口。',
};

camBtn.addEventListener('click', async () => {
  camBtn.disabled = true;
  camRows.innerHTML = '';
  const waited = row(camRows, '状态', '正在请求权限…', { cls: 't-idle', text: '等待' });

  try {
    const t0 = performance.now();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    const cost = Math.round(performance.now() - t0);

    camOk = true;
    waited.remove();
    const track = stream.getVideoTracks()[0];
    const s = track.getSettings ? track.getSettings() : {};
    row(camRows, '摄像头', '已打开', { cls: 't-ok', text: '通过' });
    row(camRows, '分辨率', (s.width || '?') + ' × ' + (s.height || '?') + '，帧率 ' + (Math.round(s.frameRate || 0) || '?'));
    row(camRows, '耗时', cost + ' 毫秒');
    reportLine('摄像头', '可用 ' + (s.width || '?') + 'x' + (s.height || '?'));

    const video = $('video');
    video.srcObject = stream;
    $('previewWrap').hidden = false;
    await video.play().catch(() => {});

    modelBtn.disabled = false;
    camBtn.textContent = '重新打开';
    camBtn.disabled = false;
  } catch (err) {
    camOk = false;
    waited.remove();
    const name = err && err.name ? err.name : '未知错误';
    row(camRows, '摄像头', '打不开', { cls: 't-bad', text: '失败' });
    row(camRows, '错误码', name);
    row(camRows, '含义', '<small>' + (CAM_ERROR[name] || (err && err.message) || '没有更多信息') + '</small>');
    reportLine('摄像头', '失败 ' + name);
    camBtn.textContent = '再试一次';
    camBtn.disabled = false;
    updateVerdict();
  }
});

/* ────────── 三、手势模型 ────────── */

const modelRows = $('modelRows');
const MODEL_URL = './models/hand_landmarker.task';
const WASM_DIR = './mediapipe/wasm';
const BUNDLE_URL = './mediapipe/vision_bundle.mjs';

/* 全部走同源。模型原本在 storage.googleapis.com，国内直连不通 —— 实测就卡死在
   「正在下载手部模型」这一步，等多久都不会动。现在这些文件随站点一起发布，
   和页面同一个域、同一条连接，不会再被拦。 */
modelBtn.addEventListener('click', async () => {
  if (!camOk) return;
  modelBtn.disabled = true;
  modelRows.innerHTML = '';
  const line = row(modelRows, '状态', '正在加载运行库…', { cls: 't-idle', text: '等待' });

  let landmarker = null;
  const t0 = performance.now();

  try {
    const vision = await import(BUNDLE_URL);
    state(line, '运行库已就绪，正在读取手部模型（7.5MB，同源）…');

    const fileset = await vision.FilesetResolver.forVisionTasks(WASM_DIR);

    landmarker = await Promise.race([
      vision.HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
        runningMode: 'VIDEO',
        numHands: 1,
      }),
      new Promise((_, reject) =>
        setTimeout(
          () =>
            reject(
              new Error('读取超时（90 秒）。文件就在本站，正常几秒就完 —— 超时说明文件没部署上去，或者路径不对。'),
            ),
          90000,
        ),
      ),
    ]);

    const loadMs = Math.round(performance.now() - t0);
    line.remove();
    row(modelRows, '加载', '成功', { cls: 't-ok', text: '通过' });
    row(modelRows, '耗时', (loadMs / 1000).toFixed(1) + ' 秒');
    reportLine('模型加载', (loadMs / 1000).toFixed(1) + 's');

    await measureFps(landmarker);
  } catch (err) {
    line.remove();
    const msg = (err && err.message) || String(err);
    row(modelRows, '加载', '失败', { cls: 't-bad', text: '失败' });
    row(modelRows, '原因', '<small>' + msg + '</small>');
    row(
      modelRows,
      '常见解释',
      '<small>超时：模型和 wasm 现在都在本站，正常几秒就读完了。如果还超时，说明这次部署没把 public/models 和 public/mediapipe 带上去。<br>delegate 相关：这台设备的 WebGL 撑不起 GPU 推理，可以改成 CPU 再试。</small>',
    );
    reportLine('模型加载', '失败 ' + msg.slice(0, 80));
    modelBtn.disabled = false;
    updateVerdict();
  }
});

function measureFps(landmarker) {
  return new Promise((resolve) => {
    const video = $('video');
    const badge = $('fpsBadge');
    const line = row(modelRows, '帧率', '正在测 4 秒，请把手举到画面里…', { cls: 't-idle', text: '测试中' });
    let frames = 0;
    let handSeen = false;
    let lastTime = -1;
    const start = performance.now();

    function loop() {
      if (video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        try {
          const res = landmarker.detectForVideo(video, performance.now());
          frames += 1;
          if (res && res.landmarks && res.landmarks.length > 0) handSeen = true;
        } catch {
          /* 单帧失败不打断整体统计 */
        }
      }
      const elapsed = performance.now() - start;
      if (elapsed < 4000) {
        badge.textContent = frames ? Math.round((frames / elapsed) * 1000) + ' fps' : '识别中';
        requestAnimationFrame(loop);
      } else {
        const fps = Math.round((frames / elapsed) * 1000);
        line.remove();
        const level = fps >= 22 ? 't-ok' : fps >= 12 ? 't-warn' : 't-bad';
        const label = fps >= 22 ? '流畅' : fps >= 12 ? '勉强' : '卡顿';
        row(modelRows, '帧率', fps + ' 帧/秒', { cls: level, text: label });
        row(modelRows, '手部检测', handSeen ? '检测到手' : '4 秒内没检测到手（可能没对着镜头，或光线太暗）', {
          cls: handSeen ? 't-ok' : 't-warn',
          text: handSeen ? '通过' : '待确认',
        });
        reportLine('帧率', fps + ' fps');
        reportLine('手部检测', handSeen ? '有' : '无');
        modelBtn.textContent = '再测一次';
        modelBtn.disabled = false;
        updateVerdict();
        resolve();
      }
    }
    requestAnimationFrame(loop);
  });
}

/* ────────── 四、陀螺仪 ────────── */

const gyroRows = $('gyroRows');
const gyroBtn = $('gyroBtn');
let gyroOk = null;

/* 桌面设备没有陀螺仪，这一节直接标注跳过。
   这里要提前说明，否则用户在电脑上看到「没收到任何事件」会以为坏了。 */
if (isDesktop) {
  const sec = gyroBtn.closest('.card');
  const hint = sec && sec.querySelector('.hint');
  if (hint) hint.textContent = '电脑没有陀螺仪，这一节跳过就行。电脑走的是摄像头那条路，而且比手机更顺。';
  gyroBtn.hidden = true;
  row(gyroRows, '陀螺仪', '电脑不需要这一节', { cls: 't-idle', text: '跳过' });
  reportLine('陀螺仪', '桌面设备跳过');
}

gyroBtn.addEventListener('click', async () => {
  gyroBtn.disabled = true;
  gyroRows.innerHTML = '';

  if (typeof DeviceOrientationEvent === 'undefined') {
    row(gyroRows, '陀螺仪', '这个环境没有方向接口', { cls: 't-bad', text: '失败' });
    reportLine('陀螺仪', '无接口');
    gyroOk = false;
    gyroBtn.disabled = false;
    updateVerdict();
    return;
  }

  const line = row(gyroRows, '状态', '正在请求权限…', { cls: 't-idle', text: '等待' });

  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const answer = await DeviceOrientationEvent.requestPermission();
      if (answer !== 'granted') throw new Error('你拒绝了方向权限');
    }

    state(line, '请把手机上下左右倾斜一下…');

    let got = 0;
    let range = 0;
    let base = null;
    const onOrient = (ev) => {
      if (ev.beta == null && ev.gamma == null) return;
      got += 1;
      const g = Number(ev.gamma || 0);
      if (base === null) base = g;
      range = Math.max(range, Math.abs(g - base));
    };
    window.addEventListener('deviceorientation', onOrient);

    await new Promise((r) => setTimeout(r, 2500));
    window.removeEventListener('deviceorientation', onOrient);
    line.remove();

    if (got > 0) {
      gyroOk = true;
      row(gyroRows, '陀螺仪', '有数据', { cls: 't-ok', text: '通过' });
      row(gyroRows, '事件数', got + ' 次 / 2.5 秒');
      row(gyroRows, '倾斜幅度', '左右摆了 ' + Math.round(range) + ' 度');
      reportLine('陀螺仪', '可用，2.5 秒 ' + got + ' 个事件');
    } else {
      gyroOk = false;
      row(gyroRows, '陀螺仪', '没有收到任何事件', { cls: 't-warn', text: '待确认' });
      row(gyroRows, '说明', '<small>可能是这个壳屏蔽了传感器，也可能是设备本身没有陀螺仪。</small>');
      reportLine('陀螺仪', '无事件');
    }
  } catch (err) {
    line.remove();
    row(gyroRows, '陀螺仪', '不可用', { cls: 't-bad', text: '失败' });
    row(gyroRows, '原因', '<small>' + ((err && err.message) || '未知') + '</small>');
    reportLine('陀螺仪', '失败');
    gyroOk = false;
  }

  gyroBtn.textContent = '再测一次';
  gyroBtn.disabled = false;
  updateVerdict();
});

/* ────────── 结论 ────────── */

function updateVerdict() {
  const card = $('verdictCard');
  const text = $('verdictText');

  if (camOk) {
    card.hidden = false;
    const fpsNote = isDesktop
      ? '电脑是跑 MediaPipe 最理想的环境：没有壳挡权限，性能和分辨率都是手机比不了的，帧率通常是手机的两三倍。'
      : '接着看第三节的帧率：22 帧以上手势会很顺，12 到 22 帧能用但要放慢动作，12 帧以下只做最简单的挥手。';
    const tail = isDesktop
      ? '鼠标那套操作会一起做——悬停、拖拽、滚轮翻信，不必只靠手势。'
      : '手机上还能再叠一层陀螺仪，作为暗光、背光时手势失灵的备选。';
    text.innerHTML = '<span class="big">摄像头这条路能走</span>' + fpsNote + '<br><br>' + tail;
    return;
  }

  if (isDesktop) {
    card.hidden = false;
    text.innerHTML =
      '<span class="big">这台电脑没有可用的摄像头</span>' +
      '不影响任何功能。电脑上本来就有鼠标那条路：悬停、拖拽、滚轮翻信，和手势共用同一套状态机。手势只是锦上添花，没有也能完整使用。';
    return;
  }

  if (gyroOk === true) {
    card.hidden = false;
    text.innerHTML =
      '<span class="big">摄像头不行，但陀螺仪行</span>' +
      '那就不做摄像头手势，改做倾斜切信 + 摇一摇抽信。这个方案零加载、零耗电，仪式感也够，而且永远不会因为光线不好而失灵。';
    return;
  }

  if (gyroOk === false) {
    card.hidden = false;
    text.innerHTML =
      '<span class="big">两条路都不通</span>' +
      '那就老老实实做触摸：点信箱抽信、滑动翻信。八音盒和视觉动效一样能做出仪式感，只是少了"隔空"这一下。';
  }
}

/* ────────── 复制报告 ────────── */

$('copyBtn').addEventListener('click', async () => {
  const text =
    '【手势能力体检】\n' +
    report.join('\n') +
    '\n\nUA：' +
    ua;
  try {
    await navigator.clipboard.writeText(text);
    const t = $('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  } catch {
    const t = $('toast');
    t.textContent = '复制失败，请手动截图';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
});
</script>
