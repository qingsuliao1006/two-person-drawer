<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FAF9F5" />
    <title>记念</title>

    <!-- 添加到主屏幕：安卓走 manifest，iOS 走下面三个 apple 前缀的 meta -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="记念" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // 在样式表生效前先把主题挂上，否则刷新时会先闪一下默认的雾绿
      try {
        var saved = localStorage.getItem('tyrqsl:theme:v1')
        if (saved && saved !== 'sage') document.documentElement.setAttribute('data-theme', saved)
      } catch (e) {}
    </script>
    <!-- 字体随站点一起发布，不依赖 Google Fonts（国内常被拦，被拦也只是静默退化） -->
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <script type="module" crossorigin src="./assets/index-DRrrfokt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bkv9ka3m.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
